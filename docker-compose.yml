# Local infrastructure for the Agentic SDLC Orchestrator.
#   docker compose up -d && docker compose ps   # every service should report "healthy"
# Apps (orchestrator :8080, shortener :8081) run on the host via ./mvnw and are
# scraped by Prometheus through host.docker.internal.

name: agentic-sdlc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # OpenObserve ships as a distroless image with no shell or HTTP client, so a
  # one-shot init container copies a statically linked busybox in for the healthcheck.
  openobserve-healthcheck-tools:
    image: busybox:1.37.0-musl
    command: ["cp", "/bin/busybox", "/tools/busybox"]
    volumes:
      - openobserve-tools:/tools

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.15.1
    restart: unless-stopped
    depends_on:
      openobserve-healthcheck-tools:
        condition: service_completed_successfully
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?set ZO_ROOT_USER_PASSWORD in .env}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
    ports:
      - "5080:5080"   # UI + HTTP/OTLP ingest
      - "5081:5081"   # OTLP gRPC ingest
    volumes:
      - openobserve-data:/data
      - openobserve-tools:/tools:ro
    healthcheck:
      test: ["CMD", "/tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
  openobserve-data:
  openobserve-tools:
  prometheus-data:
  grafana-data:
