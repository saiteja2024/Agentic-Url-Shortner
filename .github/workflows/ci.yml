name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

env:
  REDOCLY_CLI_VERSION: 2.56.1

jobs:
  spec-lint:
    name: Spec lint (OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Lints every API listed in redocly.yaml (specs/**/openapi.yaml); accepted
      # exceptions live in .redocly.lint-ignore.yaml with a reason each.
      - name: Redocly lint
        run: npx --yes @redocly/cli@${REDOCLY_CLI_VERSION} lint --format=github-actions

  build:
    name: Build, test, coverage gate
    needs: spec-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to commit SHAs (tag in the trailing comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify = Checkstyle (validate) + code generation from specs/ + compile
      #          + unit/integration tests + Spotless check + JaCoCo report + coverage gate.
      # Testcontainers uses the runner's Docker daemon.
      - name: Verify
        run: ./mvnw -B -ntp verify

      # Every Implemented requirement in specs/**/requirements.md must have a passing
      # test whose @DisplayName starts with its ID.
      - name: Requirement traceability
        run: python3 scripts/traceability.py

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traceability
          path: docs/traceability.md
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency vulnerability scan
    # Resolves the Maven graph (incl. transitives) and checks it against OSV.dev;
    # fails the build on known vulnerabilities.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # Accepted, expiring exceptions live in osv-scanner.toml (see DECISIONS.md, ADR-004).
      scan-args: |-
        --config=./osv-scanner.toml
        --recursive
        ./
      fail-on-vuln: true
      # Code-scanning upload needs GitHub Advanced Security on private repos.
      upload-sarif: ${{ github.event.repository.visibility == 'public' }}

  dependency-review:
    name: Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
