openapi: 3.1.0
info:
  title: Agentic SDLC Orchestrator API
  version: 1.0.0
  summary: Start governed SDLC runs, decide approvals, read the audit trail.
  description: |
    Contract-first: Java interfaces and models are generated from this file. Requirement IDs
    (`ORCH-0xx`) refer to [requirements.md](requirements.md).

    Reads are open so the UI and dashboards can show progress; every mutation requires the
    `X-API-Key` header (ORCH-037) or an OAuth2 JWT bearer token with the operation's scope
    (`runs:write` or `approvals:write`, ORCH-038). All errors are RFC 9457 `application/problem+json`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Agentic SDLC team
servers:
  - url: /
    description: Same origin as the orchestrator (http://localhost:8080 locally).
tags:
  - name: Runs
    description: Start, inspect and stop runs.
  - name: Approvals
    description: Human checkpoints — approve, reject, answer clarifying questions.
  - name: Audit
    description: Append-only events and run reports.

security: []

paths:
  /api/v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs, newest first
      responses:
        '200':
          description: Runs known to this instance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Runs]
      operationId: startRun
      summary: Start a run
      security:
        - apiKey: []
        - bearerAuth: [runs:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: Run accepted and executing asynchronously.
          headers:
            Location:
              description: URL of the run.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a run with its node statuses
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs/{runId}/kill:
    post:
      tags: [Runs]
      operationId: killRun
      summary: Kill switch — stop a run (ORCH-035)
      security:
        - apiKey: []
        - bearerAuth: [runs:write]
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillRequest'
      responses:
        '200':
          description: The run after stopping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/runs/{runId}/nodes/{nodeId}/replan:
    post:
      tags: [Runs]
      operationId: replanNode
      summary: Re-execute a node with new input; re-run only what changed (ORCH-036)
      security:
        - apiKey: []
        - bearerAuth: [runs:write]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplanRequest'
      responses:
        '202':
          description: Re-plan started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/runs/{runId}/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: Nodes waiting for a human (ORCH-037)
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Pending approvals, escalations and clarifications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingApproval'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs/{runId}/nodes/{nodeId}/approve:
    post:
      tags: [Approvals]
      operationId: approveNode
      summary: Approve a waiting node
      security:
        - apiKey: []
        - bearerAuth: [approvals:write]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: The run after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/runs/{runId}/nodes/{nodeId}/reject:
    post:
      tags: [Approvals]
      operationId: rejectNode
      summary: Reject a waiting node (rolls back its changes)
      security:
        - apiKey: []
        - bearerAuth: [approvals:write]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: The run after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/runs/{runId}/nodes/{nodeId}/answers:
    post:
      tags: [Approvals]
      operationId: answerClarifications
      summary: Answer clarifying questions (ORCH-034)
      security:
        - apiKey: []
        - bearerAuth: [approvals:write]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersRequest'
      responses:
        '200':
          description: The run after the answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/runs/{runId}/events:
    get:
      tags: [Audit]
      operationId: listEvents
      summary: The run's append-only audit log (ORCH-043)
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Events in sequence order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs/{runId}/report:
    get:
      tags: [Audit]
      operationId: getReport
      summary: Run summary report (ORCH-042)
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunReport'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth2 access token (JWT) from the configured issuer (ORCH-038). Scopes come from the
        `scope` or `scp` claim: `runs:write` for runs, `approvals:write` for human decisions.

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'

  schemas:
    # Enums are declared inline at each use: the generator's 3.1 support dereferences shared
    # enum $refs differently per checkout path, which changed generated types (see ADR-005).

    StartRunRequest:
      type: object
      additionalProperties: false
      required: [scenario, mode, request]
      properties:
        scenario:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,40}$'
          description: Recorded-response set for the mock LLM (e.g. greenfield, brownfield, ambiguous).
          examples: [greenfield]
        mode:
          type: string
          enum: [GREENFIELD, BROWNFIELD]
        request:
          type: string
          minLength: 1
          maxLength: 4000
          description: The requirement, in the requester's words.
          examples: [Add a function that reports the top N referrers for a link.]
        tokenBudget:
          type: integer
          minimum: 1
          description: Overrides the default LLM token budget for this run.

    KillRequest:
      type: object
      additionalProperties: false
      required: [by, reason]
      properties:
        by:
          type: string
          minLength: 1
          maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    ApproveRequest:
      type: object
      additionalProperties: false
      required: [by]
      properties:
        by:
          type: string
          minLength: 1
          maxLength: 100
        comment:
          type: string
          maxLength: 1000

    RejectRequest:
      type: object
      additionalProperties: false
      required: [by, reason]
      properties:
        by:
          type: string
          minLength: 1
          maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    AnswersRequest:
      type: object
      additionalProperties: false
      required: [by, answers]
      properties:
        by:
          type: string
          minLength: 1
          maxLength: 100
        answers:
          type: object
          description: Question id → answer. Unanswered questions become recorded assumptions.
          additionalProperties:
            type: string
            maxLength: 2000

    ReplanRequest:
      type: object
      additionalProperties: false
      required: [by, input]
      properties:
        by:
          type: string
          minLength: 1
          maxLength: 100
        input:
          type: string
          minLength: 1
          maxLength: 4000
          description: New input for the node (e.g. a revised requirement).

    RunSummary:
      type: object
      additionalProperties: false
      required: [id, scenario, mode, status, request, startedAt]
      properties:
        id:
          type: string
          format: uuid
        scenario:
          type: string
        mode:
          type: string
          enum: [GREENFIELD, BROWNFIELD]
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED]
        request:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        stopReason:
          type: string

    RunDetail:
      type: object
      additionalProperties: false
      required: [id, scenario, mode, status, request, startedAt, branch, nodes]
      properties:
        id:
          type: string
          format: uuid
        scenario:
          type: string
        mode:
          type: string
          enum: [GREENFIELD, BROWNFIELD]
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED]
        request:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        stopReason:
          type: string
        branch:
          type: string
          examples: [run/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeView'

    NodeView:
      type: object
      additionalProperties: false
      required: [id, agent, dependsOn, status, attempt]
      properties:
        id:
          type: string
        agent:
          type: string
        dependsOn:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, RUNNING, WAITING_APPROVAL, DONE, FAILED, STALE]
        attempt:
          type: integer
          minimum: 0
        failureReason:
          type: string
        waiting:
          $ref: '#/components/schemas/PendingApproval'

    PendingApproval:
      type: object
      additionalProperties: false
      required: [nodeId, kind, reasons, questions]
      properties:
        nodeId:
          type: string
        kind:
          type: string
          enum: [APPROVAL, ESCALATION, CLARIFICATION]
        reasons:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        since:
          type: string
          format: date-time

    Question:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          examples: [Q1]
        text:
          type: string

    AuditEvent:
      type: object
      additionalProperties: false
      required: [seq, type, payload, at]
      properties:
        seq:
          type: integer
          format: int64
        nodeId:
          type: string
        type:
          type: string
          examples: [NODE_TRANSITION]
        from:
          type: string
        to:
          type: string
        payload:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time

    RunReport:
      type: object
      additionalProperties: false
      required: [runId, scenario, mode, status, startedAt, nodes, gates, approvals, retries, rollbacks, clarifications, artifacts, tokens]
      properties:
        runId:
          type: string
          format: uuid
        scenario:
          type: string
        mode:
          type: string
          enum: [GREENFIELD, BROWNFIELD]
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED]
        request:
          type: string
        branch:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        stopReason:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeReport'
        gates:
          type: array
          items:
            $ref: '#/components/schemas/GateReport'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalReport'
        retries:
          type: integer
          minimum: 0
        rollbacks:
          type: array
          items:
            $ref: '#/components/schemas/RollbackReport'
        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationReport'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactReport'
        tokens:
          $ref: '#/components/schemas/TokenReport'

    NodeReport:
      type: object
      additionalProperties: false
      required: [id, status, attempts]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [PENDING, RUNNING, WAITING_APPROVAL, DONE, FAILED, STALE]
        attempts:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          format: int64
        failureReason:
          type: string

    GateReport:
      type: object
      additionalProperties: false
      required: [nodeId, gate, phase, outcome]
      properties:
        nodeId:
          type: string
        gate:
          type: string
        phase:
          type: string
        outcome:
          type: string
          enum: [PASS, FAIL, NEEDS_APPROVAL]
        reason:
          type: string
        attempt:
          type: integer

    ApprovalReport:
      type: object
      additionalProperties: false
      required: [nodeId, decision, by]
      properties:
        nodeId:
          type: string
        kind:
          type: string
          enum: [APPROVAL, ESCALATION, CLARIFICATION]
        decision:
          type: string
          enum: [APPROVED, REJECTED, ANSWERED, CANCELLED]
        by:
          type: string
        reason:
          type: string
        waitMs:
          type: integer
          format: int64

    RollbackReport:
      type: object
      additionalProperties: false
      required: [nodeId, checkpoint]
      properties:
        nodeId:
          type: string
        checkpoint:
          type: string
        reason:
          type: string

    ClarificationReport:
      type: object
      additionalProperties: false
      required: [questionId, question]
      properties:
        questionId:
          type: string
        question:
          type: string
        answer:
          type: string
        assumption:
          type: string

    ArtifactReport:
      type: object
      additionalProperties: false
      required: [nodeId, name, contentHash, parentHashes]
      properties:
        nodeId:
          type: string
        name:
          type: string
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        parentHashes:
          type: array
          items:
            type: string

    TokenReport:
      type: object
      additionalProperties: false
      required: [input, output, budget]
      properties:
        input:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        budget:
          type: integer
          format: int64

    ProblemDetail:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: true

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or wrong X-API-Key, or a missing, invalid or expired bearer token (ORCH-037, ORCH-038).
      headers:
        WWW-Authenticate:
          description: '`Bearer` challenge, with `error="invalid_token"` when a token was rejected.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Valid bearer token without the scope this operation needs (ORCH-038).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: No such run or node.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The run or node is not in a state that allows this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
