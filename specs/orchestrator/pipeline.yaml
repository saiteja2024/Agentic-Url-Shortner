# SDLC pipeline definition — loaded and validated by the orchestrator at startup (ORCH-001…003).
#
# Each stage becomes a DAG node. `dependsOn` edges are ordered with Kahn's algorithm; stages whose
# dependencies are all DONE run in parallel and re-join at a barrier. Exit gates run after the
# agent; a failing gate is retried with its output fed back to the agent, up to maxAttempts, then
# the node's changes are rolled back and it is escalated to a human. When a node is re-planned and
# its output hash changes, its dependents are marked STALE and re-run.
#
# Gates run against the run's workspace (a git branch of the target project, see requirements A3).
# This repository's own CI gates (Redocly spec lint, requirement traceability) are not repeated here.

apiVersion: agentic.io/v1alpha1
kind: Pipeline
metadata:
  name: sdlc-default
  version: 1.0.0

defaults:
  retries:
    maxAttempts: 3          # total attempts per node, including the first
    feedbackToPrompt: true
  timeout: PT10M            # run time budget (ORCH-035)
  onExhausted: escalate     # escalate | fail

gates:
  requirements-ids: { type: requirements, description: "Every requirement has a stable REQ-nnn ID and Given/When/Then criteria" }
  compile:          { type: command,  run: "mvn -B -q -DskipTests compile" }
  tests-pass:       { type: command,  run: "mvn -B -q test" }
  coverage:         { type: coverage, minLine: 0.80, description: "JaCoCo line coverage of the whole project" }
  allowed-paths:    { type: allowed-paths, description: "The agent changed only the paths its stage allows" }
  secret-scan:      { type: secret-scan,   description: "No credentials or private keys in added lines" }
  human-approval:   { type: approval, description: "A human approves the design before anything is built" }

# Changes that always need a human, whatever stage makes them (ORCH-031).
approvalPolicy:
  - id: schema-change
    match: ["**/db/migration/**", "**/*.sql", "**/openapi.yaml"]
  - id: new-dependency
    match: ["**/pom.xml", "**/package.json"]
  - id: security-sensitive
    match: ["**/security/**", "**/*Security*.java", ".github/workflows/**"]
  - id: merge
    match: ["action:merge"]

stages:
  - id: requirements
    agent: RequirementsAgent
    dependsOn: []
    inputs: [user-request]
    outputs: [requirements.md]
    allowedPaths: []
    exitGates: [requirements-ids]

  - id: impact-analysis
    agent: ImpactAnalysisAgent
    description: Brownfield only — maps the change onto existing files, APIs and data flows.
    when: brownfield
    dependsOn: [requirements]
    outputs: [impact-analysis.md]
    allowedPaths: []

  - id: design
    agent: DesignAgent
    dependsOn: [requirements, impact-analysis]
    outputs: [design.md]
    allowedPaths: []
    exitGates: [human-approval]

  - id: implement
    agent: ImplementAgent
    dependsOn: [design]
    allowedPaths: ["src/main/**"]
    exitGates: [compile, tests-pass, allowed-paths, secret-scan]

  # test-plan runs in parallel with implement: both depend only on design.
  - id: test-plan
    agent: TestPlanAgent
    dependsOn: [design]
    outputs: [test-plan.md]
    allowedPaths: []

  - id: test
    agent: TestAgent
    dependsOn: [implement, test-plan]   # join barrier
    allowedPaths: ["src/test/**"]
    exitGates: [tests-pass, coverage, allowed-paths, secret-scan]

  - id: docs
    agent: DocsAgent
    dependsOn: [test]
    allowedPaths: ["docs/**", "README.md"]
    exitGates: [allowed-paths, secret-scan]

  - id: release
    agent: ReleaseAgent
    dependsOn: [test, docs]
    outputs: [release-notes.md]
    allowedPaths: ["docs/**"]
    exitGates: [allowed-paths]          # the merge itself needs approval via approvalPolicy
